name: "IndexNow Push"

on:
  push:
    branches:
      - main
      - master

jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Send changed URLs to IndexNow
        env:
          INDEXNOW_KEY: 128b266e75164b4d9796276d274dbf5d
        run: |
          set -euo pipefail

          changed_files="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA")"
          url_lines=""

          if printf '%s\n' "$changed_files" | grep -Eq '(^|/)index\.html$'; then
            url_lines="${url_lines}https://www.matrixqr.cc/\n"
          fi
          if printf '%s\n' "$changed_files" | grep -qx 'about.html'; then
            url_lines="${url_lines}https://www.matrixqr.cc/about\n"
          fi
          if printf '%s\n' "$changed_files" | grep -qx 'llms.txt'; then
            url_lines="${url_lines}https://www.matrixqr.cc/llms.txt\n"
          fi
          if printf '%s\n' "$changed_files" | grep -qx 'llms-full.txt'; then
            url_lines="${url_lines}https://www.matrixqr.cc/llms-full.txt\n"
          fi
          if printf '%s\n' "$changed_files" | grep -qx 'robots.txt'; then
            url_lines="${url_lines}https://www.matrixqr.cc/robots.txt\n"
          fi
          if printf '%s\n' "$changed_files" | grep -qx 'sitemap.xml'; then
            url_lines="${url_lines}https://www.matrixqr.cc/sitemap.xml\n"
          fi

          if [ -z "$url_lines" ]; then
            echo "No indexable public URL changed; skipping IndexNow."
            exit 0
          fi

          url_list="$(printf '%b' "$url_lines" | sort -u | python -c 'import json,sys; print(json.dumps([x for x in sys.stdin.read().splitlines() if x]))')"

          python - "$url_list" "$INDEXNOW_KEY" <<'PY' > payload.json
          import json, sys
          urls = json.loads(sys.argv[1])
          key = sys.argv[2]
          print(json.dumps({
              "host": "www.matrixqr.cc",
              "key": key,
              "keyLocation": f"https://www.matrixqr.cc/{key}.txt",
              "urlList": urls,
          }))
          PY

          cat payload.json
          curl --fail-with-body -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data-binary @payload.json

      - name: Validate sitemap is reachable
        run: |
          curl --fail --silent --show-error --head "https://www.matrixqr.cc/sitemap.xml" > /dev/null
